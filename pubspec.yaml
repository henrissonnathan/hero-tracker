name: hero_tracker
description: Tracker de heróis, tropas e builds — armazenamento 100% local.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.3.0
  path: ^1.9.0
  shared_preferences: ^2.2.0
  path_provider: ^2.1.0
  google_fonts: ^6.2.1
  package_info_plus: ^8.0.0
  open_filex: ^4.7.0
  share_plus: ^10.0.0
  file_picker: ^8.0.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
